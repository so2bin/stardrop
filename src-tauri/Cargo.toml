[package]
name = "stardrop"
version = "1.0.0"
description = "星传 StarDrop - 手机照片秒传电脑"
authors = ["StarDrop"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "ico"] }

[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
panic = "abort"
strip = true
